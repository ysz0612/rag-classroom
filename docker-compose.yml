name: rag-classroom

services:
  # =========================================================
  # PostgreSQL + pgvector
  # =========================================================
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    ports:
      - "127.0.0.1:5433:5432"

  # =========================================================
  # Neo4j
  # =========================================================
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped

    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$$(printf '%s' \"$$NEO4J_AUTH\" | cut -d/ -f2-)\" \"RETURN 1\" >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"

  # =========================================================
  # Redis
  # =========================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # =========================================================
  # FastAPI
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment: &backend-environment
      PYTHONPATH: /app

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

      # 일부 초기화 스크립트에서 사용하는 PostgreSQL 변수
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB}"
      DB_USER: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"

      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"

      # OpenAI
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

      # JWT
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      SESSION_EXPIRE_SECONDS: "${SESSION_EXPIRE_SECONDS:-3600}"

      # CORS
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}"

    depends_on:
      postgres:
        condition: service_healthy

      neo4j:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    ports:
      - "127.0.0.1:8000:8000"

  # =========================================================
  # React + Nginx
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: ""

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8088:80"

  # =========================================================
  # 최초 데이터 초기화
  # 평소 docker compose up에서는 실행되지 않습니다.
  # =========================================================
  init-data:
    build:
      context: ./backend
      dockerfile: Dockerfile

    profiles:
      - init

    environment:
      <<: *backend-environment

    depends_on:
      postgres:
        condition: service_healthy

      neo4j:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - python
      - scripts/initialize_docker_data.py

    restart: "no"


# =========================================================
# Docker 데이터 볼륨
# =========================================================
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data: